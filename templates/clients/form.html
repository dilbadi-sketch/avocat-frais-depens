{% extends "base.html" %}

{% block title %}Formulaire Client - Calculateur de Frais et Dépens{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                {% if client %}
                    <i class="fas fa-edit"></i> Éditer Client
                {% else %}
                    <i class="fas fa-user-plus"></i> Nouveau Client
                {% endif %}
            </div>
            <div class="card-body">
                <form method="POST" class="needs-validation">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nom" class="form-label">Nom *</label>
                            <input type="text" class="form-control" id="nom" name="nom" 
                                   value="{{ client.nom if client else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="prenom" class="form-label">Prénom</label>
                            <input type="text" class="form-control" id="prenom" name="prenom" 
                                   value="{{ client.prenom if client else '' }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ client.email if client else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="telephone" class="form-label">Téléphone</label>
                            <input type="tel" class="form-control" id="telephone" name="telephone" 
                                   value="{{ client.telephone if client else '' }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="adresse" class="form-label">Adresse</label>
                        <input type="text" class="form-control" id="adresse" name="adresse" 
                               value="{{ client.adresse if client else '' }}">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="code_postal" class="form-label">Code Postal</label>
                            <input type="text" class="form-control" id="code_postal" name="code_postal" 
                                   value="{{ client.code_postal if client else '' }}">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label for="ville" class="form-label">Ville</label>
                            <input type="text" class="form-control" id="ville" name="ville" 
                                   value="{{ client.ville if client else '' }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="type_client" class="form-label">Type de Client *</label>
                        <select class="form-select" id="type_client" name="type_client" required>
                            <option value="particulier" {% if not client or client.type_client == 'particulier' %}selected{% endif %}>Particulier</option>
                            <option value="entreprise" {% if client and client.type_client == 'entreprise' %}selected{% endif %}>Entreprise</option>
                        </select>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            {% if client %}Mettre à jour{% else %}Créer{% endif %}
                        </button>
                        <a href="{% if client %}{{ url_for('client_detail', id=client.id) }}{% else %}{{ url_for('clients_list') }}{% endif %}" 
                           class="btn btn-secondary">
                            <i class="fas fa-times"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
